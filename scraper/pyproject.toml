[project]
name = "scraper"
version = "0.1.0"
description = "Multi-stage interactive mushroom scraper"
readme = "README.md"
authors = [
    { name = "Alessandro Tornesello", email = "alessandro.tornesello99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
scraper = "scraper:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
